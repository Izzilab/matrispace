url: https://Theayomideo.github.io/matrispace/

template:
  bootstrap: 5

reference:
  - title: "Preprocessing"
    contents:
      - prepare_object
      - convert_spe_to_seurat
      - translate_signatures
  - title: "Matrisome and ECM niches"
    contents:
      - score_matrisome
      - annotate_ecm_niches
      - compute_expression_metrics
  - title: "Differential expression"
    contents:
      - find_ecm_markers
      - find_all_ecm_markers
      - find_spatially_corrected_ecm_markers
      - find_ecm_de_samples
