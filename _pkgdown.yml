      - compute_lisa
      - compute_morans_i
  - title: "Matrisome-pair co-expression"
    contents:
      - score_matrisome_pair_coexpression
      - find_matrisome_pair_enrichment
      - aggregate_matrisome_pairs
  - title: "Visualization"
    contents:
      - plot_spatial_feature
      - plot_matrisome
      - plot_spatial_blend
      - plot_lisa
      - palette_ecm
  - title: "Reference data"
    contents:
      - matrisome_db
      - matrisome_signatures
      - ecm_signatures
      - matrisome_pairs
      - ecm_markers
  - title: "Deprecated"
    contents:
      - annotate_ecm_domains
